  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Puzzle Pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
        #puzzle-board { display: grid; gap: 5px; margin: 20px auto; }
        .tile { width: 80px; height: 80px; background: #3498db; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border-radius: 5px; }
        .tile.empty { background: #bdc3c7; }
        .store-card { background: white; padding: 15px; margin: 10px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; }
        #withdraw-form { background: white; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="game-ui">
        <h2>Coins: <span id="total-coins">0</span></h2>
        <button onclick="setLevel('easy')">Easy (3x3)</button>
        <button onclick="setLevel('hard')">Hard (4x4)</button>
        <div id="puzzle-board"></div>
        <button onclick="toggleStore(true)" style="padding:10px 20px; margin-top:20px;">Store</button>
    </div>

    <div id="store-section" style="display:none;">
        <div id="items-list"></div>
        <button onclick="toggleStore(false)" style="margin-top:20px;">Back to Game</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let gridSize = 3;
        let tiles = [];
        let score = parseInt(localStorage.getItem('diamondScore')) || 0;
        let selectedItem = null;

        document.getElementById('total-coins').innerText = score;

        function setLevel(level) {
            gridSize = (level === 'hard') ? 4 : 3;
            initGame();
        }

        function initGame() {
            tiles = Array.from({length: gridSize * gridSize}, (_, i) => i);
            shuffle();
        }

        function shuffle() {
            for (let i = 0; i < 200; i++) {
                const emptyIdx = tiles.indexOf(gridSize * gridSize - 1);
                const n = [];
                if (emptyIdx >= gridSize) n.push(emptyIdx - gridSize);
                if (emptyIdx < gridSize * (gridSize - 1)) n.push(emptyIdx + gridSize);
                if (emptyIdx % gridSize !== 0) n.push(emptyIdx - 1);
                if (emptyIdx % gridSize !== gridSize - 1) n.push(emptyIdx + 1);
                const r = n[Math.floor(Math.random() * n.length)];
                [tiles[emptyIdx], tiles[r]] = [tiles[r], tiles[emptyIdx]];
            }
            createBoard();
        }

        function createBoard() {
            const board = document.getElementById('puzzle-board');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 80px)`;
            board.innerHTML = '';
            tiles.forEach((tile, index) => {
                const div = document.createElement('div');
                div.className = 'tile' + (tile === gridSize * gridSize - 1 ? ' empty' : '');
                div.innerText = tile === gridSize * gridSize - 1 ? '' : tile + 1;
                div.onclick = () => moveTile(index);
                board.appendChild(div);
            });
        }

        function moveTile(index) {
            const emptyIdx = tiles.indexOf(gridSize * gridSize - 1);
            const r = Math.floor(index / gridSize), c = index % gridSize;
            const er = Math.floor(emptyIdx / gridSize), ec = emptyIdx % gridSize;
            if (Math.abs(r - er) + Math.abs(c - ec) === 1) {
                [tiles[index], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[index]];
                createBoard();
                if (tiles.every((t, i) => t === i)) {
                    score += (gridSize === 3 ? 10 : 20);
                    localStorage.setItem('diamondScore', score);
                    document.getElementById('total-coins').innerText = score;
                    tg.showAlert("Level Complete! 🎉");
                    setTimeout(initGame, 1000);
                }
            }
        }

        function toggleStore(show) {
            document.getElementById('game-ui').style.display = show ? 'none' : 'block';
            document.getElementById('store-section').style.display = show ? 'block' : 'none';
            if (show) renderStore();
        }

        function renderStore() {
            const list = document.getElementById('items-list');
            list.innerHTML = '<h3>Redeem Points:</h3>';
            const items = [{ name: '₹50 Withdraw', coins: 5000 }, { name: '₹100 Withdraw', coins: 10000 }];
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `<b>${item.name}</b><br><small>${item.coins} coins</small>`;
                card.onclick = () => {
                    if (score >= item.coins) {
                        selectedItem = item;
                        list.innerHTML = `
                            <div id="withdraw-form">
                                <h3>Details: ${item.name}</h3>
                                <input type="text" id="w-name" placeholder="Name" style="width:90%;margin-bottom:10px;"><br>
                                <input type="text" id="w-gpay" placeholder="GPay/UPI No" style="width:90%;margin-bottom:10px;"><br>
                                <button onclick="processWithdraw()" style="width:100%;padding:10px;background:green;color:white;border:none;">Confirm</button>
                            </div>
                        `;
                    } else { tg.showAlert("Coins a tawk lo!"); }
                };
                list.appendChild(card);
            });
        }

        function processWithdraw() {
            let name = document.getElementById('w-name').value;
            let gpay = document.getElementById('w-gpay').value;
            if (!name || !gpay) { alert("Details dah vek rawh!"); return; }
            tg.sendData(JSON.stringify({ type: "withdraw", name, gpay, item: selectedItem.name }));
            tg.showAlert("Success! Admin-ah thawn a ni.");
        }

        initGame();
    </script>
</body>
</html>
